# Releases the package when develop is merged into main: the version from the conventional commits since the last
# release (in 0.x a breaking change bumps the minor, a feature or a fix the patch), the changelog, the release commit
# and its tag, the GitHub release, then the package staged on npm with provenance through trusted publishing (no
# token). A staged version is public only once a maintainer approves it with 2FA (`npm stage approve`), so this
# workflow alone cannot put a version in front of users. The release commit then goes back to develop. The first
# release was published by hand (npm cannot trust a workflow for a package that does not exist yet): see the README.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "An explicit version (when the commits do not say it); empty takes it from the commits"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # the release commit, its tag and the GitHub release
  contents: write
  # npm's trusted publishing and the provenance statement
  id-token: write

jobs:
  release:
    # the release commit itself, pushed to main by this job, releases nothing
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    # npm trusts this environment only, which runs from main only: no other job or branch can publish
    environment: npm
    steps:
      # main and develop take no direct push, except from the release app: its token, made for this run and revoked
      # at its end, pushes the release commit, its tags and the merge back to develop (the workflow's own token cannot
      # be exempted from the rules)
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks
      # the version, the changelog, the release commit, its tag and the GitHub release; npm is the next step
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)+$APP_SLUG[bot]@users.noreply.github.com"
          if [ -n "$VERSION" ]; then
            pnpm nx release "$VERSION" --skip-publish
          else
            pnpm nx release --skip-publish
          fi
      # commits that release nothing (docs, ci, chore) leave main untagged: then there is no new version to stage
      - name: Find the new version
        id: tag
        run: echo "name=$(git tag --points-at HEAD 'v*')" >> "$GITHUB_OUTPUT"
      # the trust relationship allows staging only: the version waits on npm for `npm stage approve`
      - name: Stage on npm
        if: ${{ steps.tag.outputs.name != '' }}
        run: npm stage publish --provenance
      - name: Bring the release commit back to develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-edit main
          git push origin develop
