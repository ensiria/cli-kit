# Releases the package when develop is merged into main: the version from the conventional commits since the last
# release (in 0.x a breaking change bumps the minor, a feature or a fix the patch), the changelog, the release commit
# and its tag, the GitHub release, then npm with provenance through trusted publishing (no token). The release commit
# then goes back to develop. The first release is published by hand (npm cannot trust a workflow for a package that
# does not exist yet): see the README; this workflow takes every release after it.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "An explicit version (when the commits do not say it); empty takes it from the commits"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # the release commit, its tag and the GitHub release
  contents: write
  # npm's trusted publishing and the provenance statement
  id-token: write

jobs:
  release:
    # the release commit itself, pushed to main by this job, releases nothing
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    # npm trusts this environment only, which runs from main only: no other job or branch can publish
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$VERSION" ]; then
            pnpm nx release "$VERSION" --yes
          else
            pnpm nx release --yes
          fi
      - name: Bring the release commit back to develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-edit main
          git push origin develop
